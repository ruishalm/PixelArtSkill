<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Gatinho Pixel Art 3D - PurrModoro Edition</title>
  <link rel="stylesheet" href="cat-3d.css" />
</head>
<body>

  <div class="badge">
    <h1>🐱 Gatinho Pixel Art 3D Animado</h1>
    <p>Chapéuzinhos, Carinho, Posturas PurrModoro e Marquinha Anime (*) | Arraste para girar 360°</p>
  </div>

  <canvas id="viewport" width="540" height="540"></canvas>

  <div class="hud">
    <button id="btnFront" class="btn btn-secondary">Frente</button>
    <button id="btnIso" class="btn btn-secondary">3/4 Iso</button>
    <button id="btnSide" class="btn btn-secondary">Lado</button>
    <button id="btnBack" class="btn btn-secondary">Costas (*)</button>
    <button id="btnAutoSpin" class="btn">🔄 Girar</button>
    <button id="btnHat" class="btn btn-secondary">🎩 Chapéu: Nenhum</button>
    <button id="btnPosture" class="btn btn-secondary">🐾 Postura: Andando</button>
    <button id="btnPet" class="btn btn-secondary">💕 Carinho</button>
    <button id="btnSlices" class="btn btn-secondary">🥞 Fatias</button>
    <div class="label">
      <span>Inclinação:</span>
      <input type="range" id="squashSlider" min="0.60" max="0.95" step="0.01" value="0.75">
    </div>
  </div>

  <script src="../assets/voxels/cat-voxel-data.js"></script>
  <script src="../src/examples/cat-3d/01-cat-viewer.js"></script>
</body>
</html>
